        opentelemetry.io/name: accounting
    spec:
      containers:
      - env:
        - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
          value: cumulative
        - name: KAFKA_ADDR
          value: kafka:9092
        - name: DB_CONNECTION_STRING
          value: Host=postgresql;Username=otelu;Password=otelp;Database=otel
        - name: OTEL_DOTNET_AUTO_TRACES_KAFKA_INSTRUMENTATION_ENABLED
          value: "true"
        - name: SW_APM_OPEN_TELEMETRY
          value: Enabled
        - name: SW_APM_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: swo-apm
              optional: false
        - name: SW_APM_SERVICE_KEY
          value: $(SW_APM_SERVICE_TOKEN):astronomyshop-accounting
        envFrom:
        - configMapRef:
            name: swo-config
        image: public.ecr.aws/solarwinds-online-demos/swo-demo/astronomyshop:2.2.0-accounting
        imagePullPolicy: IfNotPresent
        name: accounting
        resources:
          limits:
            memory: 120Mi
        volumeMounts: null
      initContainers:
      - command:
        - sh
        - -c
