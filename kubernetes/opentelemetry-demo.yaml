apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/component: database-maintenance
    app.kubernetes.io/name: postgresql-cleanup
    app.kubernetes.io/part-of: opentelemetry-demo
  name: postgresql-cleanup
  namespace: otel-demo
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/component: database-maintenance
            app.kubernetes.io/name: postgresql-cleanup
        spec:
          containers:
          - command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "Starting PostgreSQL cleanup job at $(date)"

              # Wait for PostgreSQL to be available
              until pg_isready -h $PGHOST -p $PGPORT -U $PGUSER; do
                echo "Waiting for PostgreSQL to be ready..."
                sleep 2
              done

              echo "PostgreSQL is ready. Starting cleanup..."

              # Delete data from specified tables
              echo "Cleaning up 'order' table..."
              psql -c "DELETE FROM accounting.\"order\";" || echo "Warning: Failed to clean 'order' table or table doesn't exist"

              echo "Cleaning up 'orderitem' table..."
              psql -c "DELETE FROM accounting.orderitem;" || echo "Warning: Failed to clean 'orderitem' table or table doesn't exist"

              echo "Cleaning up 'shipping' table..."
              psql -c "DELETE FROM accounting.shipping;" || echo "Warning: Failed to clean 'shipping' table or table doesn't exist"

              # Get row counts to verify cleanup
              echo "Verifying cleanup results:"
              psql -c "SELECT 'order' as table_name, COUNT(*) as remaining_rows FROM accounting.\"order\" UNION ALL SELECT 'orderitem', COUNT(*) FROM accounting.orderitem UNION ALL SELECT 'shipping', COUNT(*) FROM accounting.shipping;" || echo "Warning: Could not verify cleanup results"

              echo "PostgreSQL cleanup job completed successfully at $(date)"
            env:
            - name: PGHOST
              value: postgresql
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: otel
            - name: PGUSER
              value: root
            - name: PGPASSWORD
              value: otel
            image: postgres:17.5
            name: postgresql-cleanup
            resources:
              limits:
                cpu: 200m
                memory: 128Mi
              requests:
                cpu: 100m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
              runAsGroup: 999
              runAsNonRoot: true
              runAsUser: 999
            volumeMounts:
            - mountPath: /tmp
              name: tmp
          restartPolicy: OnFailure
          volumes:
          - emptyDir: {}
            name: tmp
  schedule: 0 2 * * 0
  successfulJobsHistoryLimit: 3
  timeZone: UTC
